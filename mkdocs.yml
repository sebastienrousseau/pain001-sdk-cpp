# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The user manual, built from docs/ by `make docs` (MkDocs Material,
# strict) after Doxygen has written the API reference to docs/api/.
# CI builds it on every pull request and deploys it to GitHub Pages from
# main (.github/workflows/manual.yml).

site_name: pain001-sdk-cpp
site_description: A typed C++17 client for the pain001 REST API.
site_url: https://sebastienrousseau.com/pain001-sdk-cpp/
copyright: '&copy; 2026 <a href="https://sebastienrousseau.com/" rel="author">Sebastien Rousseau</a>'
repo_url: https://github.com/sebastienrousseau/pain001-sdk-cpp
repo_name: sebastienrousseau/pain001-sdk-cpp
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site
strict: true

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - API reference: api-reference.md
  - Architecture: ARCHITECTURE.md
  - Comparison: COMPARISON.md
  - Benchmarks: BENCHMARKS.md
  - Policies: POLICIES.md
  - Packaging: packaging.md
  - Roadmap: ROADMAP.md
  - Decision records:
      - adr/README.md
      - adr/0001-thin-client-over-the-server.md
      - adr/0002-dependencies-libcurl-and-nlohmann-json.md
      - adr/0003-error-model.md
      - adr/0004-opt-in-retries-for-idempotent-calls.md
      - adr/0005-source-compatibility-not-abi-stability.md
      - adr/0006-cmake-package-no-registry-yet.md
  - Releases:
      - 0.0.88: releases/0.0.88.md
  - Project:
      - README: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/README.md
      - Development: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/DEVELOPMENT.md
      - Contributing: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/CONTRIBUTING.md
      - Changelog: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/CHANGELOG.md
      - Security: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/SECURITY.md
      - Support: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/SUPPORT.md
      - Governance: https://github.com/sebastienrousseau/pain001-sdk-cpp/blob/main/GOVERNANCE.md
