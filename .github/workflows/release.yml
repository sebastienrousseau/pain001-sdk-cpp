# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Release on a signed tag v<version>: check the tag and every version
# file, run the tests and the installed-package test, then build the
# source archive, the CycloneDX SBOM and SHA256SUMS, attest their build
# provenance and write the GitHub release ("pain001-sdk-cpp <version>",
# Highlights, What's Changed, Checksums, Full Changelog). There is no
# package registry yet (docs/packaging.md); the archive and the CMake
# package config are the distribution.
#
# workflow_dispatch runs the same build as a dry run by default: it
# prints the notes and uploads the files as a workflow artifact, and the
# publish job is skipped. Re-running is safe: an existing release is
# updated in place (assets replaced, title and notes rewritten).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the v (e.g. 0.0.88)"
        required: true
      dry_run:
        description: "Build and compose only; do not publish"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "not a version: $version" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Every version file says the version
        run: scripts/verify-release-versions "${{ steps.version.outputs.version }}"

      - name: The tag is annotated, with the release message
        if: github.event_name == 'push'
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          subject=$(git tag -l --format='%(contents:subject)' "$GITHUB_REF_NAME")
          test "$subject" = "pain001-sdk-cpp $GITHUB_REF_NAME"

      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Unit tests and the installed-package test
        run: |
          make test
          make package-test

      - name: Source archive, SBOM and checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix="pain001-sdk-cpp-$VERSION/" \
            -o "dist/pain001-sdk-cpp-$VERSION.tar.gz" HEAD
          python3 scripts/sbom.py "$VERSION" > "dist/pain001-sdk-cpp-$VERSION.cdx.json"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.cdx.json

      - name: Compose the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ref="v$VERSION"
          git rev-parse -q --verify "refs/tags/$ref" > /dev/null || ref=HEAD
          scripts/release-notes.sh "$VERSION" dist "$ref" > dist/RELEASE-NOTES.md
          cat dist/RELEASE-NOTES.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ steps.version.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push' || inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ needs.build.outputs.version }}
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tag="v$VERSION"
          title="pain001-sdk-cpp $VERSION"
          assets=(dist/*.tar.gz dist/*.cdx.json dist/SHA256SUMS)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --title "$title" --notes-file dist/RELEASE-NOTES.md \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --verify-tag --title "$title" \
              --notes-file dist/RELEASE-NOTES.md --repo "$GITHUB_REPOSITORY"
          fi

      - name: Audit the live release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          name=$(gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json name --jq .name)
          test "$name" = "pain001-sdk-cpp $VERSION"
          gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | grep -q '^## Checksums'
