# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The user manual: Doxygen renders the public header into docs/api/ with
# warnings as errors (an undocumented member fails), then MkDocs Material
# builds docs/ strictly, so a broken link or nav entry fails the pull
# request. From main, the site deploys to GitHub Pages through the
# official actions; Pages must be set to "GitHub Actions" in the
# repository settings first (DEVELOPMENT.md).
name: Manual

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the manual (Doxygen, MkDocs strict)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Doxygen and MkDocs (hash-pinned)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen
          python -m pip install --quiet --disable-pip-version-check --require-hashes \
            -r docs/requirements.txt

      - name: Build
        run: make docs

      - name: Every page carries the author line
        run: |
          missing=$(find site -name '*.html' -not -name 'doxygen_crawl.html' -print0 \
            | xargs -0 grep -L 'rel="author">Sebastien Rousseau</a>' || true)
          if [ -n "$missing" ]; then echo "$missing"; exit 1; fi

      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
