# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Lint (version files, clang-format, file size, the complexity ceilings
# measured by rust-code-analysis, and clang-tidy), build and unit tests
# on GCC and Clang (Clang with ASan and UBSan), 100% line and branch
# coverage, and the conformance kit against a live `pain001 serve`.
name: CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Format, file size and clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Tool versions
        run: |
          cmake --version
          clang-format-18 --version
          clang-tidy-18 --version

      - name: Version files agree
        run: make versions

      - name: Format and file size
        run: make format-check filesize CLANG_FORMAT=clang-format-18

      - name: Cache rust-code-analysis-cli
        id: rca-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/rust-code-analysis-cli
          key: rca-0.0.25-${{ runner.os }}

      - name: Install rust-code-analysis-cli
        if: steps.rca-cache.outputs.cache-hit != 'true'
        run: cargo install rust-code-analysis-cli --version 0.0.25 --locked

      - name: Complexity ceilings (cyclomatic, cognitive, Halstead, lines)
        run: make complexity

      - name: clang-tidy (bugprone, performance, complexity ceilings)
        run: make tidy CLANG_TIDY=clang-tidy-18

  build:
    name: Build and unit tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cxx: g++
            flags: ""
          - name: clang-sanitizers
            cxx: clang++-18
            flags: "-fsanitize=address,undefined -fno-sanitize-recover=undefined"
    env:
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Build with warnings as errors, run the tests
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          make test CMAKE_ARGS="-DCMAKE_CXX_FLAGS='$FLAGS' -DCMAKE_EXE_LINKER_FLAGS='$FLAGS'"

      - name: The examples were built
        run: for name in basic health validate check faces project_face raw_request errors timeouts_retries api_key; do test -x "build/pain001_$name"; done

  package:
    name: Installed CMake package (find_package)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Install to a prefix, build and run a consumer against it
        run: make package-test

  coverage:
    name: Coverage (100% line and branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CXX: clang++-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Unit tests with source-based coverage, gate at 100%
        run: make coverage LLVM_COV=llvm-cov-18 LLVM_PROFDATA=llvm-profdata-18

      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            build-coverage/coverage.lcov
            build-coverage/coverage.json
          if-no-files-found: ignore
          retention-days: 14

  conformance:
    name: Conformance kit against pain001 serve
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PAIN001_BASE_URL: http://127.0.0.1:8000
      # A synthetic key: the server requires it, the tests and examples
      # send it, and examples/api_key.cpp shows the 401 without it.
      PAIN001_API_KEY: ci-synthetic-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install the server (hash-pinned)
        run: |
          python -m venv "$RUNNER_TEMP/server"
          "$RUNNER_TEMP/server/bin/pip" install --require-hashes --no-deps \
            -r ci/server-requirements.txt
          "$RUNNER_TEMP/server/bin/pain001" --version

      - name: Start pain001 serve
        run: |
          cd "$RUNNER_TEMP"
          nohup "$RUNNER_TEMP/server/bin/pain001" serve --host 127.0.0.1 --port 8000 \
            > "$RUNNER_TEMP/server.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fsS "$PAIN001_BASE_URL/api/v1/health"; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/server.log"
          exit 1

      - name: Install libcurl headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Conformance cases and typed tests (fail on any skip)
        run: make conformance

      - name: Every example against the server
        run: make examples

      - name: Benchmark smoke run (client-side and loopback, not asserted)
        run: make bench BENCH_ARGS=--benchmark_min_time=0.01s

      - name: Server log
        if: failure()
        run: cat "$RUNNER_TEMP/server.log"
