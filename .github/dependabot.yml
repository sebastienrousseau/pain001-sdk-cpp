# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# Dependabot has no CMake FetchContent ecosystem, so the nlohmann/json
# and GoogleTest pins in CMakeLists.txt and tests/CMakeLists.txt are
# reviewed by hand. It does track the workflow actions and the server
# the conformance job installs.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "ci/cd"
      - "automated"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/ci"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
